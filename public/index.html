// ========== DEVICE FINGERPRINTING ==========
function generateDeviceFingerprint() {
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
ctx.textBaseline = 'top';
ctx.font = '14px Arial';
ctx.textBaseline = 'alphabetic';
ctx.fillStyle = '#f60';
ctx.fillRect(125, 1, 62, 20);
ctx.fillStyle = '#069';
ctx.fillText('Buffet Allergen System', 2, 15);

const canvasData = canvas.toDataURL();

const fingerprint = {
canvas: hashCode(canvasData),
screen: `${screen.width}x${screen.height}x${screen.colorDepth}`,
timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
language: navigator.language,
platform: navigator.platform,
hardwareConcurrency: navigator.hardwareConcurrency || 0,
deviceMemory: navigator.deviceMemory || 0,
cookieEnabled: navigator.cookieEnabled,
doNotTrack: navigator.doNotTrack || 'unknown'
};

const fingerprintString = JSON.stringify(fingerprint);
return 'FP-' + hashCode(fingerprintString);
}

function hashCode(str) {
let hash = 0;
for (let i = 0; i < str.length; i++) {
const char = str.charCodeAt(i);
hash = ((hash << 5) - hash) + char;
hash = hash & hash;
}
return Math.abs(hash).toString(36).toUpperCase();
}

let deviceFingerprint = localStorage.getItem('deviceFingerprint');
if (!deviceFingerprint) {
deviceFingerprint = generateDeviceFingerprint();
localStorage.setItem('deviceFingerprint', deviceFingerprint);
}

// ========== ICONOS OFICIALES DE ALÉRGENOS (Basados en FSA UK) ==========
const ALLERGENS = {

// ========== INICIALIZACIÓN ==========
document.addEventListener('DOMContentLoaded', async () => {

window.location.href = '/activation';
return;
}

const valid = await checkLicense();
if (valid) {
await initializeApp();
} else {
window.location.href = '/activation';
}
});

async function checkLicense() {
try {
const response = await fetch('/api/license/verify-with-device', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
licenseKey,
deviceFingerprint
})
});

const data = await response.json();

if (data.success) {
establishment = data.establishment;
document.getElementById('establishmentName').textContent = establishment.name;

const licenseInfo = document.getElementById('licenseInfo');
const daysRemaining = establishment.daysRemaining;

if (daysRemaining <= 7) {
licenseInfo.innerHTML = `⚠️ ${daysRemaining} días | ${establishment.maxDevices} dispositivos`;
licenseInfo.className = 'text-sm bg-yellow-500 px-4 py-2 rounded-lg font-bold';
} else {
licenseInfo.innerHTML = `✅ Activa | ${establishment.maxDevices} dispositivos`;
licenseInfo.className = 'text-sm bg-green-500 px-4 py-2 rounded-lg';
}

return true;
} else {
if (data.code === 'MAX_DEVICES_REACHED') {
showDeviceLimitModal(data);
} else {
showToast('❌ ' + data.error, 'error');
}
localStorage.removeItem('licenseKey');
return false;
}
} catch (error) {
console.error('Error:', error);
showToast('❌ Error de conexión', 'error');
return false;
}
}

async function fetchWithLicense(url, options = {}) {
if (!options.headers) {
options.headers = {};
}
options.headers['X-License-Key'] = licenseKey;
options.headers['X-Device-Fingerprint'] = deviceFingerprint;
return fetch(url, options);
}

let speechRecognition = null;
let isRecording = false;

function toggleVoiceInput() {
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
const micButton = document.getElementById('micButton');

if (!SpeechRecognitionAPI) {
showToast('⚠️ Tu navegador no soporta dictado por voz. Usa el teclado.', 'warning');
return;
}

if (isRecording) {
speechRecognition.stop();
return;
}

speechRecognition = new SpeechRecognitionAPI();
speechRecognition.lang = 'es-ES';
speechRecognition.continuous = false;
speechRecognition.interimResults = false;

speechRecognition.onstart = () => {
isRecording = true;
micButton.classList.add('animate-pulse');
micButton.style.borderColor = 'var(--color-accent)';
};

speechRecognition.onresult = (event) => {
const transcript = event.results[0][0].transcript;
document.getElementById('dishDescription').value = transcript;
};

speechRecognition.onerror = (event) => {
if (event.error === 'not-allowed' || event.error === 'permission-denied') {
showToast('⚠️ Permiso de micrófono denegado', 'warning');
} else {
showToast('⚠️ No se pudo reconocer el audio, inténtalo de nuevo', 'warning');
}
};

speechRecognition.onend = () => {
isRecording = false;
micButton.classList.remove('animate-pulse');
micButton.style.borderColor = '';
};

speechRecognition.start();
}

function resizeImageToDataUrl(file, maxDimension = 1280, quality = 0.8) {
return new Promise((resolve, reject) => {
const img = new Image();
const reader = new FileReader();

reader.onload = () => { img.src = reader.result; };
reader.onerror = reject;

img.onload = () => {
let { width, height } = img;
if (width > height && width > maxDimension) {
height = Math.round(height * (maxDimension / width));
width = maxDimension;
} else if (height > maxDimension) {
width = Math.round(width * (maxDimension / height));
height = maxDimension;
}

const canvas = document.createElement('canvas');
canvas.width = width;
canvas.height = height;
canvas.getContext('2d').drawImage(img, 0, 0, width, height);
resolve(canvas.toDataURL('image/jpeg', quality));
};
img.onerror = reject;

reader.readAsDataURL(file);
});
}

<p>No hay pantallas registradas todavía</p>
<p class="text-xs mt-2">Añádelas desde Supabase (tabla esl_screens)</p>
</div>
`;
return;
}

container.innerHTML = screens.map(screen => `
<div class="bg-white rounded-xl shadow-sm p-5 hover:shadow-md transition-all border-2 border-gray-100">
<h3 class="font-bold text-lg mb-1">Puesto ${screen.slot_number}</h3>
<p class="text-xs text-gray-400 mb-3">${screen.mac}</p>

<div class="mb-3">
${screen.dish
? `<div class="p-2 bg-blue-50 rounded-lg text-sm font-semibold text-blue-800">🍽️ ${screen.dish.name}</div>`
: `<div class="p-2 bg-gray-50 rounded-lg text-sm text-gray-400">Sin asignar</div>`
}
</div>

<select id="select-${screen.mac}" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg mb-2 text-sm">
<option value="">-- Seleccionar plato --</option>
${dishes.map(d => `<option value="${d.id}" ${screen.current_dish_id === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
</select>

<button onclick="assignScreen('${screen.mac}')" class="btn-primary w-full text-white text-sm font-bold py-2 px-3 rounded-lg">
✅ Asignar y Enviar
</button>
</div>
`).join('');
}

async function assignScreen(mac) {
const select = document.getElementById(`select-${mac}`);
const dishId = select.value;

if (!dishId) {
showToast('⚠️ Selecciona un plato', 'warning');
return;
}

showToast('📡 Enviando a la pantalla...', 'info');

try {
const response = await fetchWithLicense(`/api/screens/${mac}/assign`, {
method: 'PUT',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ dishId: parseInt(dishId) })
});

const data = await response.json();

if (data.success) {
showToast('✅ Pantalla actualizada', 'success');
loadScreens();
} else {
showToast('❌ Error: ' + data.error, 'error');
}
} catch (error) {
console.error('Error:', error);
showToast('❌ Error de conexión', 'error');
}
}

async function refreshAllScreens() {
showToast('📡 Refrescando todas las pantallas...', 'info');
try {
const response = await fetchWithLicense('/api/screens/refresh-all', { method: 'POST' });
const data = await response.json();
if (data.success) {
showToast(`✅ ${data.results.length} pantallas actualizadas`, 'success');
} else {
showToast('❌ Error: ' + data.error, 'error');
}
} catch (error) {
console.error('Error:', error);
showToast('❌ Error de conexión', 'error');
}
}

function showToast(message, type = 'info') {
const colors = {
success: 'bg-green-500',
error: 'bg-red-500',
warning: 'bg-yellow-500',
info: 'bg-blue-500'
};

const toast = document.createElement('div');
toast.className = `fixed top-4 right-4 ${colors[type]} text-white px-5 py-3 rounded-lg shadow-lg z-50 text-sm font-medium animate-slide-up`;
toast.textContent = message;

document.body.appendChild(toast);

setTimeout(() => {
toast.remove();
}, 3000);
}
</script>
